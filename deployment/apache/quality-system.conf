ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1 quality-system.local
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    ServerAlias 127.0.0.1 quality-system.local
    DocumentRoot "C:/quality_system"

    SSLEngine on
    SSLCertificateFile "C:/quality_system_config/tls/quality-system.crt"
    SSLCertificateKeyFile "C:/quality_system_config/tls/quality-system.key"
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    SetEnv APP_PRODUCTION 1
    SetEnv QUALITY_STORAGE_ROOT "C:/quality_system_storage"

    RewriteEngine On
    RewriteCond C:/quality_system%{REQUEST_URI} !-f
    RewriteCond C:/quality_system%{REQUEST_URI} !-d
    RewriteRule ^ /router.php [L]

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <Directory "C:/quality_system">
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex login.php
    </Directory>

    <LocationMatch "(?i)^/(?:app|database|deployment|docs|scripts|tests|vendor)(?:/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)(?:^\.|\.(?:bak|bat|conf|dist|ini|json|lock|log|md|ps1|sql|xml|yml|yaml))$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(?:composer|phpunit|README)\.">
        Require all denied
    </FilesMatch>

    ErrorLog "C:/quality_system_storage/logs/apache-error.log"
    CustomLog "C:/quality_system_storage/logs/apache-access.log" combined
</VirtualHost>
